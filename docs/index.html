<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>PROJECT RECLAIM</title>
		<!--
			커스텀 로딩 셸.

			Godot 기본 셸을 베끼고 "표시" 부분만 갈아 끼웠다. 엔진 부팅 로직과
			익스포터가 치환하는 자리표시자는 하나도 건드리지 않았다.
			하나라도 빠지면 빌드가 아예 안 뜬다.

			(자리표시자를 이 주석에 그대로 적으면 빌드 산출물에 남아 검사에 걸린다.
			 목록은 Godot 템플릿의 godot.html 을 참고할 것.)

			왜 필요한가: wasm 이 39MB 라 첫 로딩이 10~20초 걸린다. 기본 셸은 그동안
			검은 화면에 얇은 진행 바 하나만 보여준다. 심사자가 흰/검은 화면을 보고
			닫으면 게임이 완성돼 있어도 끝이다. (DESIGN R1)
		-->
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }

body {
	color: #eceef5;
	background-color: #13151a;
	overflow: hidden;
	touch-action: none;
	font-family: "GGSmall", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
}

/* 게임 안과 같은 폰트를 쓴다. 로딩 화면만 다른 서체면 그 순간 톤이 끊긴다.
   .pck 안이 아니라 웹 루트에 따로 복사해 둔 파일을 참조한다 - 셸은 게임이
   로드되기 **전에** 뜨므로 .pck 안의 리소스에는 접근할 수 없다. */
@font-face {
	font-family: "GGTitle";
	src: url("HeirofLightBold.ttf") format("truetype");
	font-display: swap;
}
@font-face {
	font-family: "GGSmall";
	src: url("DNFBitBitv2.ttf") format("truetype");
	font-display: swap;
}

#canvas { display: block; }
#canvas:focus { outline: none; }

/* 기본 셸의 진행 바와 스플래시는 쓰지 않는다. 자리만 남겨 둔다 (스크립트가 참조). */
#status-progress, #status-splash { display: none !important; }

#status {
	position: absolute;
	left: 0; right: 0; top: 0; bottom: 0;
	background: radial-gradient(ellipse at 50% 40%, #1b1f29 0%, #0e1014 70%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 10;
}

#gg-title {
	font-family: "GGTitle", "GGSmall", sans-serif;
	font-size: 54px;
	letter-spacing: 0.10em;
	color: #ffc759;
	margin-bottom: 6px;
}

#gg-title-ko { font-size: 18px; color: #8b90a0; letter-spacing: 0.22em; margin-bottom: 10px; }
#gg-sub { font-size: 13px; color: #6a6f7e; margin-bottom: 34px; }

/* TIP · 헌사. 게임 안 로딩 화면과 같은 자리, 같은 색이다. */
#gg-tip {
	margin-top: 22px;
	font-size: 13px;
	color: #8b90a0;
	max-width: 640px;
	text-align: center;
	line-height: 1.8;
	min-height: 44px;
}
#gg-tip.dedication { color: #b8c4ef; }

/* 지직거리는 주사선. 게임 안 로딩 화면의 _draw() 와 같은 연출이다.
   신호가 불안정한 화면처럼 보이게 해서, 이 게임이 "시뮬레이션" 이라는 설정을
   첫 화면부터 깔아 둔다. */
#status::before {
	content: "";
	position: absolute;
	left: 0; right: 0; top: 0; bottom: 0;
	pointer-events: none;
	background: repeating-linear-gradient(
		to bottom,
		rgba(255,255,255,0.020) 0px,
		rgba(255,255,255,0.020) 1px,
		transparent 1px,
		transparent 8px);
}
#status::after {
	content: "";
	position: absolute;
	left: 0; right: 0;
	height: 3px;
	pointer-events: none;
	background: rgba(140,190,255,0.10);
	animation: gg-scan 3.6s linear infinite;
}
@keyframes gg-scan {
	from { top: -4px; }
	to   { top: 100%; }
}

#gg-barwrap {
	width: 420px;
	height: 8px;
	background: #23262f;
	border-radius: 4px;
	overflow: hidden;
}

#gg-bar {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #59bf72, #8fe0a2);
	transition: width 0.18s ease-out;
}

#gg-pct { margin-top: 12px; font-size: 13px; color: #8b90a0; }
#gg-hint { margin-top: 28px; font-size: 12px; color: #5b6070; max-width: 520px; text-align: center; line-height: 1.7; }

/* 오류 표시. 기본 셸의 notice 를 그대로 쓰되 스타일만 맞춘다. */
#status-notice {
	margin-top: 24px;
	color: #ff8a80;
	font-size: 13px;
	line-height: 1.6;
	text-align: center;
	max-width: 640px;
	display: none;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			이 브라우저는 canvas 를 지원하지 않습니다.
		</canvas>

		<noscript>
			이 브라우저는 JavaScript 가 꺼져 있습니다. 켜야 실행됩니다.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>

			<div id="gg-title">PROJECT RECLAIM</div>
			<div id="gg-title-ko">프로젝트 리클레임</div>
			<div id="gg-sub">규칙을 짜서 AI를 싸우게 하는 격자 오토배틀러</div>

			<div id="gg-barwrap"><div id="gg-bar"></div></div>
			<div id="gg-pct">불러오는 중…</div>

			<div id="gg-tip">불러오는 중…</div>

			<div id="gg-hint">
				용량이 커서 처음 여는 데 10~30초 걸립니다. 데스크탑 브라우저를 권장합니다.
			</div>

			<div id="status-notice"></div>
		</div>

		<script>
// ── TIP · 헌사 ───────────────────────────────────────────────────────────
// 게임 안 로딩 화면과 같은 문구를 쓴다. 셸은 .pck 가 로드되기 **전에** 뜨므로
// data/tips.json 을 직접 못 읽는다. 웹 루트에 복사해 둔 tips.json 을 받아 쓰고,
// 없으면 아래 최소 목록으로 버틴다 - 로딩 화면이 소스 하나 때문에 비면 안 된다.
var GG_FALLBACK = {
	dedication_pct: 12,
	tips: [
		"슬롯은 위에서부터 읽힌다. 조건이 헐거운 카드를 1번에 두면 아래가 전부 죽는다.",
		"한 틱에 한 행동뿐이다. 물러나는 틱은 쏘지 못하는 틱이다.",
		"궁극기는 전투당 한 번뿐이다. 전술 카드는 조건만 맞으면 매 틱 발동한다.",
	],
	dedications: ["사라진 모든 지휘관들에게 바치는 헌사."]
};

(function () {
	var box = document.getElementById('gg-tip');
	var data = GG_FALLBACK;

	function pick() {
		var deds = data.dedications || [];
		var tips = data.tips || [];
		var pct = data.dedication_pct || 12;
		if (deds.length && Math.random() * 100 <= pct) {
			box.className = 'dedication';
			return deds[Math.floor(Math.random() * deds.length)];
		}
		box.className = '';
		if (!tips.length) return '';
		return 'TIP.   ' + tips[Math.floor(Math.random() * tips.length)];
	}

	function show() {
		box.style.opacity = 0;
		setTimeout(function () {
			box.textContent = pick();
			box.style.transition = 'opacity 0.4s';
			box.style.opacity = 1;
		}, 400);
	}

	fetch('tips.json').then(function (r) { return r.json(); })
		.then(function (j) { data = j; show(); })
		.catch(function () { show(); });

	// 다운로드가 길다. 한 줄만 띄워 두면 읽고 나서 할 게 없다.
	setInterval(show, 6500);
}());
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14257744,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const ggBar = document.getElementById('gg-bar');
	const ggPct = document.getElementById('gg-pct');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('알 수 없는 오류가 발생했습니다.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = '오류\n이 브라우저에 다음 기능이 없어 실행할 수 없습니다:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				// 기본 셸의 progress 요소도 함께 갱신해 둔다 (숨겨져 있지만 상태는 맞춘다).
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const pct = Math.min(100, Math.round((current / total) * 100));
					ggBar.style.width = pct + '%';
					ggPct.textContent = pct + '%   (' + (current / 1048576).toFixed(1)
						+ ' / ' + (total / 1048576).toFixed(1) + ' MB)';
				} else {
					// 서버가 전체 크기를 안 알려주는 경우. 진행률을 알 수 없으므로
					// 막대를 애매하게 채우지 말고 문구로만 알린다.
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					ggBar.style.width = '35%';
					ggPct.textContent = '불러오는 중…';
				}
			},
		}).then(() => {
			ggBar.style.width = '100%';
			ggPct.textContent = '시작합니다';
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
