# PROJECT RECLAIM — 웹 빌드 · GitHub Pages 배포
#
# push 한 번이면 브라우저에서 도는 빌드까지 자동으로 간다.
#
# ── 왜 CI 에서 빌드하는가 ────────────────────────────────────────────────
# 예전에는 로컬에서 build_web.ps1 을 돌리고 docs/ 를 통째로 커밋했다. 그러면
# 28MB 짜리 pck 가 커밋마다 저장소에 쌓이고, 무엇보다 **빌드를 잊으면 사이트가
# 소스보다 뒤처진다.** 실제로 "웹 빌드가 아예 안 바뀐다" 는 일이 한 번 있었다 -
# 그때는 export_path 가 저장소 밖을 가리키고 있었고, 아무도 몰랐다.
#
# 여기서 빌드하면 사이트가 항상 master 와 같다. 확인할 것이 하나 줄어든다.
#
# ── 판올림할 때 ──────────────────────────────────────────────────────────
# GODOT_VERSION 한 줄만 고친다. 엔진과 익스포트 템플릿은 **반드시 같은 판**
# 이어야 한다 - 어긋나면 export 가 조용히 실패하거나 깨진 wasm 이 나온다.
name: web

on:
  push:
    branches: [master]
  # 손으로도 돌릴 수 있게 둔다. 엔진만 올리고 확인하고 싶을 때가 있다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연달아 push 하면 나중 것이 이긴다.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 과 익스포트 템플릿 내려받기
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          # 템플릿은 판 이름 그대로의 폴더에 놓아야 엔진이 찾는다.
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: 리소스 임포트
        # .godot/ 은 커밋하지 않으므로 여기서 처음 만들어진다. 임포트가 끝나기
        # 전에 export 를 부르면 텍스처와 음원이 통째로 빠진다.
        #
        # 이 명령은 실패해도 0 이 아닌 값을 내놓을 수 있다(에디터가 종료
        # 코드를 그렇게 쓴다). 다음 단계의 export 가 진짜 판정이므로 여기서는
        # 막지 않는다.
        run: ./godot --headless --import || true

      - name: 검증
        # 배포 전에 최소한 파싱과 코어는 통과해야 한다. 깨진 빌드를 올리는
        # 것은 안 올리는 것보다 나쁘다 - 심사자가 그걸 먼저 본다.
        run: |
          set -euo pipefail
          ./godot --headless --script res://test/parse_check.gd
          ./godot --headless --script res://test/headless_test.gd
          ./godot --headless --script res://test/audit.gd

      - name: 웹 익스포트
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          ./godot --headless --export-release "Web" build/web/index.html
          ls -la build/web
          # pck 와 wasm 이 없으면 export 가 조용히 실패한 것이다.
          test -f build/web/index.pck
          test -f build/web/index.wasm

      - name: Jekyll 끄기
        # Jekyll 은 밑줄로 시작하는 파일을 배포에서 뺀다. 게임 빌드에는 손해만 있다.
        run: touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
